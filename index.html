<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>HKO Synchronized PiP Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    h1 {
      font-size: 1.2rem;
      color: #8b949e;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    canvas {
      width: 100%;
      max-width: 480px;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      background: #161b22;
      display: block;
      z-index: 2;
    }
    .controls {
      margin-top: 25px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 2;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
      transition: transform 0.1s ease;
    }
    button:active {
      transform: scale(0.96);
    }
    button.sync {
      background: #1f6feb;
      box-shadow: 0 4px 12px rgba(31, 111, 235, 0.3);
    }
    button.test {
      background: #d29922;
      box-shadow: 0 4px 12px rgba(210, 153, 34, 0.3);
    }
    button.alert-btn {
      background: #8957e5;
      box-shadow: 0 4px 12px rgba(137, 87, 229, 0.3);
    }
    
    /* Video container required for iOS PiP compositing */
    video#pipVideo {
      position: absolute;
      top: 0;
      left: 0;
      width: 320px;
      height: 160px;
      opacity: 0.001;
      pointer-events: none;
      z-index: 1;
    }

    .status {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #8b949e;
      text-align: center;
      z-index: 2;
    }

    /* Modal Overlay Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal h2 {
      font-size: 1.1rem;
      color: #f0f6fc;
      margin-bottom: 16px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
      text-align: left;
    }
    .field-group label {
      font-size: 0.8rem;
      color: #8b949e;
      text-transform: uppercase;
      font-weight: 600;
    }
    .field-group input {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #f0f6fc;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-family: monospace;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: flex-end;
    }
    .modal-actions button.cancel {
      background: #21262d;
      box-shadow: none;
      color: #c9d1d9;
    }
  </style>
</head>
<body>

  <h1>HK Time Sync Clock</h1>
  
  <canvas id="timerCanvas" width="600" height="300"></canvas>
  
  <video id="pipVideo" autoplay playsinline muted></video>

  <div class="controls">
    <button class="test" onclick="captureTestTimestamp()">Capture Time (5s)</button>
    <button class="alert-btn" onclick="openAlertModal()">Set Alert</button>
    <button class="sync" onclick="syncHKTime()">Sync HKO Time</button>
    <button onclick="togglePiP()">Open Picture-in-Picture</button>
  </div>
  
  <div class="status" id="statusLog">Starting clock engine...</div>

  <!-- Set Alert Config Modal -->
  <div class="modal-overlay" id="alertModal">
    <div class="modal">
      <h2>Configure Red Alert</h2>
      <div class="field-group">
        <label>Start Second (0 - 59)</label>
        <input type="number" id="alertSecondInput" min="0" max="59" value="59">
      </div>
      <div class="field-group">
        <label>Start Millisecond (0 - 999)</label>
        <input type="number" id="alertMsInput" min="0" max="999" value="200">
      </div>
      <div class="field-group">
        <label>Duration (Seconds)</label>
        <input type="number" id="alertDurationInput" min="1" max="30" value="5">
      </div>
      <div class="modal-actions">
        <button class="cancel" onclick="closeAlertModal()">Cancel</button>
        <button onclick="saveAlertConfig()">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('timerCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('pipVideo');
    const statusLog = document.getElementById('statusLog');

    let timeOffsetMs = 0;
    let isStreamReady = false;

    // Default Alert Settings: Start at xx:mm:59:200 for 5.0 seconds
    let alertSecond = 59;
    let alertMs = 200;
    let alertDurationSec = 5;

    // Test timestamp capture state variables
    let capturedTimeString = null;
    let testClearTimeout = null;

    // 1. Multi-Endpoint Time Sync Engine
    async function syncHKTime() {
      statusLog.innerText = "Calibrating time sync with primary server...";

      const endpoints = [
        {
          name: "WorldTimeAPI",
          url: "https://worldtimeapi.org/api/timezone/Asia/Hong_Kong",
          parse: (data) => new Date(data.datetime).getTime()
        },
        {
          name: "TimeAPI.io",
          url: "https://timeapi.io/api/time/current/zone?timeZone=Asia/Hong_Kong",
          parse: (data) => new Date(data.dateTime).getTime()
        },
        {
          name: "Cloudflare Server Time",
          url: "https://1.1.1.1/cdn-cgi/trace",
          parseText: (text) => {
            const match = text.match(/ts=(\d+\.\d+|\d+)/);
            return match ? parseFloat(match[1]) * 1000 : null;
          }
        }
      ];

      for (const api of endpoints) {
        const samples = [];
        const NUM_SAMPLES = 2;

        for (let i = 0; i < NUM_SAMPLES; i++) {
          try {
            const t0 = performance.now();
            const response = await fetch(`${api.url}${api.url.includes('?') ? '&' : '?'}_t=${Date.now()}_${i}`, {
              cache: "no-store"
            });
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const t1 = performance.now();

            let serverTime = null;
            if (api.parseText) {
              const text = await response.text();
              serverTime = api.parseText(text);
            } else {
              const data = await response.json();
              serverTime = api.parse(data);
            }

            if (!serverTime) throw new Error("Invalid payload format");

            const rtt = t1 - t0;
            const latency = rtt / 2;

            samples.push({
              offset: (serverTime + latency) - Date.now(),
              rtt: rtt
            });
          } catch (err) {
            console.warn(`[Sync] ${api.name} sample ${i + 1} failed:`, err.message);
          }
          await new Promise(res => setTimeout(res, 40));
        }

        if (samples.length > 0) {
          samples.sort((a, b) => a.rtt - b.rtt);
          const bestSample = samples[0];
          timeOffsetMs = bestSample.offset;
          statusLog.innerText = `Synced via ${api.name}! RTT: ${bestSample.rtt.toFixed(1)}ms | Offset: ${timeOffsetMs.toFixed(1)}ms`;
          return;
        }
      }

      statusLog.innerText = "Network sync blocked/failed. Running on local device clock.";
    }

    // 2. Alert Modal Handlers
    function openAlertModal() {
      document.getElementById('alertSecondInput').value = alertSecond;
      document.getElementById('alertMsInput').value = alertMs;
      document.getElementById('alertDurationInput').value = alertDurationSec;
      document.getElementById('alertModal').classList.add('active');
    }

    function closeAlertModal() {
      document.getElementById('alertModal').classList.remove('active');
    }

    function saveAlertConfig() {
      const sec = parseInt(document.getElementById('alertSecondInput').value, 10);
      const ms = parseInt(document.getElementById('alertMsInput').value, 10);
      const dur = parseFloat(document.getElementById('alertDurationInput').value);

      if (!isNaN(sec) && sec >= 0 && sec <= 59) alertSecond = sec;
      if (!isNaN(ms) && ms >= 0 && ms <= 999) alertMs = ms;
      if (!isNaN(dur) && dur > 0) alertDurationSec = dur;

      closeAlertModal();
      const msPadded = String(alertMs).padStart(3, '0');
      statusLog.innerText = `Alert set to xx:mm:${String(alertSecond).padStart(2, '0')}:${msPadded} (${alertDurationSec}s duration)`;
    }

    // 3. Capture Click Timestamp for 5 Seconds
    function captureTestTimestamp() {
      const clickTimeMs = Date.now() + timeOffsetMs;
      const clickedDate = new Date(clickTimeMs);

      const hh = String(clickedDate.getHours()).padStart(2, '0');
      const mm = String(clickedDate.getMinutes()).padStart(2, '0');
      const ss = String(clickedDate.getSeconds()).padStart(2, '0');
      const ms = String(clickedDate.getMilliseconds()).padStart(3, '0');

      capturedTimeString = `${hh}:${mm}:${ss}:${ms}`;
      statusLog.innerText = `Captured Click Time: ${capturedTimeString}`;

      if (testClearTimeout) clearTimeout(testClearTimeout);

      testClearTimeout = setTimeout(() => {
        capturedTimeString = null;
        statusLog.innerText = "Resumed live clock.";
      }, 5000);
    }

    // 4. Render Loop with Dynamic Red Alert Detection
    function render() {
      const exactNowMs = Date.now() + timeOffsetMs;
      const now = new Date(exactNowMs);

      // Compute millisecond offset relative to the start of the current minute (0..59999ms)
      const currentMinuteMs = (now.getSeconds() * 1000) + now.getMilliseconds();
      
      // Calculate configured alert start time within the minute
      const alertStartMs = (alertSecond * 1000) + alertMs;
      const alertDurationMs = alertDurationSec * 1000;

      // Evaluate alert state considering minute wraparounds
      let isRedAlert = false;
      const deltaMs = (currentMinuteMs - alertStartMs + 60000) % 60000;
      if (deltaMs < alertDurationMs) {
        isRedAlert = true;
      }

      // Clear Canvas Background
      ctx.fillStyle = '#161b22';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (capturedTimeString) {
        // Render Frozen Test Timestamp
        ctx.strokeStyle = '#d29922';
        ctx.lineWidth = 6;
        ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);

        ctx.fillStyle = '#f2cc60';
        ctx.font = 'bold 52px Courier, Courier New, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(capturedTimeString, canvas.width / 2, canvas.height / 2 - 10);

        ctx.fillStyle = '#d29922';
        ctx.font = 'bold 16px -apple-system, sans-serif';
        ctx.fillText('TIMESTAMP CAPTURED (5s HOLD)', canvas.width / 2, canvas.height / 2 + 55);

      } else {
        // Render Live Clock
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        const ms = String(now.getMilliseconds()).padStart(3, '0');

        const primaryColor = isRedAlert ? '#ff4d4d' : '#58a6ff';

        if (isRedAlert) {
          ctx.strokeStyle = primaryColor;
          ctx.lineWidth = 8;
          ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
        }

        ctx.fillStyle = primaryColor;
        ctx.font = 'bold 52px Courier, Courier New, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${hh}:${mm}:${ss}:${ms}`, canvas.width / 2, canvas.height / 2 - 10);

        ctx.fillStyle = isRedAlert ? '#ff9999' : '#8b949e';
        ctx.font = '16px -apple-system, sans-serif';
        ctx.fillText('HKT (UTC+8) • High-Precision Timer', canvas.width / 2, canvas.height / 2 + 55);
      }

      requestAnimationFrame(render);
    }

    // 5. Media Stream Pipeline Initialization
    async function initStream() {
      try {
        if (!isStreamReady) {
          const stream = canvas.captureStream(60);
          video.srcObject = stream;
          await video.play();
          isStreamReady = true;
        }
      } catch (e) {
        console.warn("Stream init waiting for user action:", e);
      }
    }

    // 6. Picture-in-Picture Control
    async function togglePiP() {
      try {
        if (!isStreamReady || video.paused) {
          await initStream();
        }

        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        statusLog.innerText = "PiP Error: " + err.message;
      }
    }

    // Execution sequence
    render();
    initStream();
    syncHKTime();
  </script>
</body>
</html>
