<script>
  const canvas = document.getElementById('timerCanvas');
  const ctx = canvas.getContext('2d');
  const video = document.getElementById('pipVideo');
  const statusLog = document.getElementById('statusLog');

  let timeOffsetMs = 0;
  let isStreamReady = false;

  // 1. High-Precision Time Sync Engine (Multi-Sample Cristian's Algorithm)
  async function syncHKTime() {
    statusLog.innerText = "Calibrating precision sync with HK servers...";
    
    // Public NTP-over-HTTP fallback endpoint with low latency in East Asia
    const endpoint = 'https://worldtimeapi.org/api/timezone/Asia/Hong_Kong'; 
    const samples = [];
    const NUM_SAMPLES = 5;

    for (let i = 0; i < NUM_SAMPLES; i++) {
      try {
        const t0 = performance.now();
        const response = await fetch(`${endpoint}?t=${Date.now()}_${i}`, { cache: "no-store" });
        const t1 = performance.now();
        const data = await response.json();

        const serverTime = new Date(data.datetime).getTime();
        const rtt = t1 - t0;
        const latency = rtt / 2;

        samples.push({
          offset: (serverTime + latency) - Date.now(),
          rtt: rtt
        });
      } catch (err) {
        console.warn("Sample failed:", err);
      }
      // Brief pause between requests to prevent network queuing
      await new Promise(res => setTimeout(res, 80));
    }

    if (samples.length > 0) {
      // Pick the sample with the absolute lowest Round Trip Time (RTT)
      samples.sort((a, b) => a.rtt - b.rtt);
      const bestSample = samples[0];
      
      timeOffsetMs = bestSample.offset;
      statusLog.innerText = `Synced! RTT: ${bestSample.rtt.toFixed(1)}ms | Offset: ${timeOffsetMs.toFixed(1)}ms`;
    } else {
      statusLog.innerText = "Sync failed. Operating on internal device clock.";
    }
  }

  // 2. Stable 60 FPS Render Engine (Eliminates Jitter/Shakiness)
  function render() {
    // High precision timestamp including current offset
    const exactNowMs = Date.now() + timeOffsetMs;
    const now = new Date(exactNowMs);

    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    
    // Exact Frame Calculation (60 FPS = 16.666ms per frame)
    const ms = now.getMilliseconds();
    const frameNumber = Math.floor(ms / (1000 / 60)); 
    const ff = String(Math.min(59, frameNumber)).padStart(2, '0');

    // Clear Canvas
    ctx.fillStyle = '#161b22';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Render Time with Rigid Font System to Prevent Text Shifting
    ctx.fillStyle = '#58a6ff';
    ctx.font = '700 62px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${hh}:${mm}:${ss}:${ff}`, canvas.width / 2, canvas.height / 2 - 10);

    ctx.fillStyle = '#8b949e';
    ctx.font = '16px -apple-system, sans-serif';
    ctx.fillText('HKT (UTC+8) • 60 FPS Engine', canvas.width / 2, canvas.height / 2 + 55);

    requestAnimationFrame(render);
  }

  // 3. Initialize Background Media Stream for PiP
  async function initStream() {
    try {
      if (!isStreamReady) {
        const stream = canvas.captureStream(60);
        video.srcObject = stream;
        await video.play();
        isStreamReady = true;
      }
    } catch (e) {
      console.warn("Stream init waiting for user action:", e);
    }
  }

  async function togglePiP() {
    try {
      if (!isStreamReady || video.paused) {
        await initStream();
      }

      if (document.pictureInPictureElement) {
        await document.exitPictureInPicture();
      } else {
        await video.requestPictureInPicture();
      }
    } catch (err) {
      statusLog.innerText = "PiP Error: " + err.message;
    }
  }

  // Start System Loop
  render();
  syncHKTime();
  initStream();
</script>
